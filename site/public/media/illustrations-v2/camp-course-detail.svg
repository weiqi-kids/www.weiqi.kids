      </g>
      <circle cx="945" cy="356" r="27" fill="none" stroke="#2C2422" stroke-width="8"/>
      <text x="945" y="469" fill="#342B28" font-size="32" font-weight="900">實作二</text>
      <text x="945" y="508" fill="#A65D3A" font-size="19" font-weight="700">修正再挑戰</text>
    </g>
