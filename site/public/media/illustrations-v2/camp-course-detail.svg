  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 0H528C450 77 418 155 448 234C475 305 403 367 302 337C192 305 96 334 0 405V0Z" fill="#FFFFFF" opacity="0.48"/>
