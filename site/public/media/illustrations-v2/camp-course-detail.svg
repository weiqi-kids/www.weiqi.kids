  <g fill="#E88952" opacity="0.32">
    <circle cx="88" cy="150" r="13"/><circle cx="133" cy="113" r="8"/><circle cx="1510" cy="160" r="13"/><circle cx="1463" cy="113" r="8"/>
    <circle cx="94" cy="729" r="8"/><circle cx="1510" cy="720" r="9"/>
  </g>
  <g stroke="#E88952" stroke-width="8" stroke-linecap="round" opacity="0.45">
    <path d="M218 115v24M206 127h24"/><path d="M1388 94v24M1376 106h24"/>
  </g>

