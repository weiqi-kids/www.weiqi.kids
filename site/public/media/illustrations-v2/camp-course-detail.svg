<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 共學營一個月課程安排</title>
  <desc id="desc">狐狸朵拉與狸貓岈荹站在課程看板兩側，看板依序列出主題教學、實作一、實作二、實作三，並標示為期一個月。</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1490" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9F0"/>
      <stop offset="0.48" stop-color="#FFE1BD"/>
      <stop offset="1" stop-color="#F5A56B"/>
    </linearGradient>
    <linearGradient id="board" x1="800" y1="128" x2="800" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#51433D"/>
      <stop offset="1" stop-color="#2F2927"/>
    </linearGradient>
    <linearGradient id="pinkCloth" x1="100" y1="450" x2="410" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6CDD6"/>
      <stop offset="1" stop-color="#CF8794"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#7A3F24" flood-opacity="0.18"/>
    </filter>
  </defs>

