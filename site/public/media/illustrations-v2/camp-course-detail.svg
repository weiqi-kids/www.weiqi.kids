    <rect x="270" y="113" width="1060" height="564" rx="42" fill="#9B5B3D" stroke="#2C2422" stroke-width="13"/>
    <rect x="300" y="143" width="1000" height="504" rx="25" fill="url(#board)" stroke="#E9B77E" stroke-width="7"/>
    <path d="M338 184H1262" stroke="#74645D" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <text x="800" y="211" fill="#FFF7E8" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif" font-size="41" font-weight="800" text-anchor="middle" letter-spacing="4">一門課的學習旅程</text>
  <path d="M629 235H971" stroke="#E9B77E" stroke-width="6" stroke-linecap="round"/>

